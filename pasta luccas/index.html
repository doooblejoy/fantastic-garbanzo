<html><!--Tag Abertura do código HTML-->
    <head><!--tag do cabeçalho da página-->
        <title>Aula de Web</title><!--Tag do título da guia do navegador-->
    </head><!--fechamento da Tag do cabeçarelho da página-->
    <body><!--Tag do corpo da pagina (conteúdo)-->
        <ul><!--Tag de lista (unordered list - lista não ordenada)-->
            <li>1º </li><!--Tag de item da lista-->
            <li>2º </li>
            <li>3º </li>
        </ul><!--Fechamento da Tag da lista-->
        <a href="http://google.com" target="_blank"><!--Tag de link-->
        <img src="imagem.jpg"></img><!--Tag de imagem-->
    </a><!--Fechamento da Tag de link-->
    <!--Tag de parágrafo-->
        <p>esta é a TAG de parágrafo</p><!--Fechamento da Tag de parágrafo-->
        <h1>TAG para títulos<!--Tag para título. Variação da 1 a 6-->
            <h2>H2 para títulos</h2>
            <h3>H3 para títulos</h3>
            <h4>H4 para títulos</h4>
            <h5>H5 para títulos</h5>
            <h6>H6 para títulos</h6>
        </h1>   
    </body><!--Fechamento da tag do corpo da paçína-->
</html><!--fechamento da tag de HTML-->
